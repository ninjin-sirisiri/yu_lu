<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>招待リンク</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="invite-root">
      <h1 id="invite-title">招待リンク</h1>

      <!-- role=status: state messages are announced without touching HTML -->
      <p id="invite-status" role="status"></p>

      <section id="invite-panel" hidden>
        <p id="invite-token-label">招待コード</p>
        <p><code id="invite-token"></code></p>
        <p id="invite-expiry-note">招待は有効期限 (発行から7日間) を過ぎると使えません。</p>

        <div id="invite-actions">
          <!-- iOS: explicit tap → clipboard copy → App Store (only after success) -->
          <button id="invite-ios-button" type="button" hidden>App Storeで開く</button>
          <!-- Android: Play URL carries invitation=<urlencoded token> in referrer -->
          <a id="invite-android-link" href="#" hidden>Google Playで開く</a>
        </div>

        <div id="invite-ios-failure" hidden>
          <p id="invite-ios-failure-title"></p>
          <p id="invite-ios-failure-help"></p>
          <button id="invite-ios-retry" type="button">もう一度試す</button>
          <p id="invite-reopen-label">招待リンクをもう一度開く場合:</p>
          <p><code id="invite-reopen-link"></code></p>
        </div>

        <div id="invite-other-platform" hidden>
          <p id="invite-other-help">
            スマートフォンでこのリンクを開くと、アプリのストアページへ進めます。
          </p>
          <p id="invite-url-label">招待リンク:</p>
          <p><code id="invite-url"></code></p>
        </div>
      </section>

      <p id="invite-test-badge" hidden></p>
    </main>

    <!-- Generated by scripts/build-invite-web.mjs; the checked-in stub
         leaves the config unset so a raw file:// or unbuilt copy renders
         an explanation instead of a broken page. -->
    <script src="runtime-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
